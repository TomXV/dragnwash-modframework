name: No game files

# The repository must never contain the game's files or BepInEx binaries.
# Reference assemblies stay in the ignored libs/ folder on each machine.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for binaries and game assets
        run: |
          found=$(git ls-files | grep -Ei '(^|/)libs/|\.(dll|pdb|exe|so|dylib|assets|ress|resource|bundle|unity3d)$' || true)
          if [ -n "$found" ]; then
            echo "These files must not be committed:"
            echo "$found"
            while IFS= read -r f; do
              echo "::error file=$f,title=Game or binary file committed::$f must not be in the repository (game files and BepInEx binaries stay in the ignored libs/ folder). Remove it with git rm --cached and commit."
            done <<< "$found"
            exit 1
          fi
          echo "OK"
      - name: Compare every file with the fingerprints of real game installs
        run: python3 tools/check-game-files.py
