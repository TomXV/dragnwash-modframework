# Dependabot keeps the few things this repository does depend on up to date.
#
# The game's own assemblies are not here and never will be (see the No game
# files workflow): they are copied from a local install into the ignored libs/
# folder, so Dependabot neither sees nor touches them. What is left is the
# handful of NuGet packages the desktop tools use, and the actions the
# workflows run.
#
# Each ecosystem is grouped into one pull request a week instead of one per
# package: Microsoft.NETFramework.ReferenceAssemblies alone appears in
# thirteen project files, and thirteen identical pull requests help nobody.
# A pull request still has to pass CI and the No game files check like any
# other, and merging it stays a person's decision.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "Actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    # Every folder with a .csproj. Add new ones here when a project is added.
    directories:
      - "/src/*"
      - "/installer"
      - "/crashreporter"
      - "/codegraph"
      - "/codegraph-standalone"
      - "/launcher"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "NuGet"
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
