<!doctype html>
<html lang="en" class="mf-write pb-edge">
<head>
<meta charset="utf-8">
<title>Drag'n Wash ModFramework</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<!-- The page is the launcher's whole window (borderless, 720×440). One header, then one board at a time:
     the logo intro (0), the updates list (1), updating (2, and B after an in-game update) and failed (3).
     launcher.js switches them as events come in from the launcher. -->
<div class="lw" id="win">

  <header class="lhead veiled" id="head">
    <img class="hlogo" id="hlogo" src="logo-notagames.png" alt="Drag'n Wash ModFramework">
    <div class="app">Drag'n Wash ModFramework</div>
    <div class="statewrap" id="state" aria-live="polite"></div>
    <div class="wc">
      <button type="button" id="btn-min" data-t-label="minimize">&#8212;</button>
      <button type="button" id="btn-close" data-t-label="close">&#10005;</button>
    </div>
  </header>

  <!-- the header logo's copy that glides down to its place above the progress bar -->
  <div class="fly" id="fly" aria-hidden="true"><img src="logo-notagames.png" alt=""></div>

  <!-- 0: logo intro. One image, shown piece by piece through clip-paths and masks (the file itself is untouched) -->
  <section class="intro" id="intro" hidden>
    <div class="waves" aria-hidden="true"><i class="w1"></i><i class="w2"></i><i class="w3"></i></div>
    <div class="big" id="big" role="img" aria-label="Drag'n Wash ModFramework">
      <img class="full" src="logo-notagames.png" alt="">
      <div class="pc gD l0"></div><div class="pc gd l1"></div><div class="pc gd l2"></div><div class="pc gd l3"></div><div class="pc gd l4"></div><div class="pc gd l5"></div><div class="gearspin"><div class="gshine"><div class="gband"></div></div></div><div class="pc gs l6"></div><div class="pc gw l8"></div><div class="pc gw l9"></div><div class="pc gw l10"></div><div class="pc gw l11"></div><div class="pc gm l12"></div><div class="pc gm l13"></div><div class="pc gm l14"></div><div class="pc gm l15"></div><div class="pc gm l16"></div><div class="pc gm l17"></div><div class="pc gm l18"></div><div class="pc gm l19"></div><div class="pc gm l20"></div><div class="pc gm l21"></div><div class="pc gm l22"></div><div class="pc gm l23"></div>
      <div class="scan"></div><svg class="mfw" viewBox="0 0 1200 624" preserveAspectRatio="none" aria-hidden="true"><defs><mask id="mfw0" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="624"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M221 575 L219 578 L219 597 L221 615" stroke-width="21" pathLength="1" style="--dl:1.300s;--du:0.014s"/><path d="M220 576 L223 574 L226 574 L232 578 L239 598 L244 601 L250 596 L257 576 L265 572 L267 573 L269 577 L269 595 L268 597 L269 617" stroke-width="21" pathLength="1" style="--dl:1.318s;--du:0.042s"/><path d="M310 568 L301 568 L295 571 L291 576 L288 586 L288 597 L290 606 L294 612 L301 616 L310 616 L315 614 L320 609 L323 603 L325 592 L323 580 L320 575 L315 570 L308 568" stroke-width="19.4" pathLength="1" style="--dl:1.367s;--du:0.046s"/><path d="M346 573 L344 578 L344 603 L346 610 L348 612" stroke-width="20.6" pathLength="1" style="--dl:1.422s;--du:0.013s"/><path d="M348 571 L354 568 L360 568 L368 570 L374 576 L378 588 L377 603 L370 613 L363 616 L354 616 L349 613" stroke-width="20.6" pathLength="1" style="--dl:1.439s;--du:0.031s"/><path d="M418 572 L417 573 L417 590 L418 592 L418 612 L417 615" stroke-width="23.9" pathLength="1" style="--dl:1.478s;--du:0.015s"/><path d="M419 571 L423 568 L444 568 L446 569" stroke-width="23.9" pathLength="1" style="--dl:1.496s;--du:0.009s"/><path d="M418 592 L420 593 L437 593" stroke-width="23.9" pathLength="1" style="--dl:1.510s;--du:0.006s"/><path d="M464 570 L461 579 L461 588 L463 595 L462 597 L463 614" stroke-width="22" pathLength="1" style="--dl:1.524s;--du:0.015s"/><path d="M465 569 L471 566 L479 566 L487 570 L490 577 L490 584 L488 589 L480 596 L466 596 L465 595 L462 596 L465 595 L466 596 L480 596 L482 605 L492 615" stroke-width="22" pathLength="1" style="--dl:1.543s;--du:0.038s"/><path d="M529 571 L523 574 L520 580 L517 590 L516 598 L517 603 L514 606 L510 616" stroke-width="23.9" pathLength="1" style="--dl:1.589s;--du:0.017s"/><path d="M529 571 L535 572 L537 574 L542 590 L543 601 L550 615" stroke-width="23.9" pathLength="1" style="--dl:1.611s;--du:0.017s"/><path d="M517 603 L520 604 L542 604 L544 603 L545 604" stroke-width="23.9" pathLength="1" style="--dl:1.632s;--du:0.010s"/><path d="M568 574 L567 576 L568 615" stroke-width="21.5" pathLength="1" style="--dl:1.650s;--du:0.014s"/><path d="M567 576 L571 572 L574 572 L579 575 L587 599 L593 601 L598 596 L604 576 L610 572 L615 573 L616 575 L616 602 L615 604 L616 615" stroke-width="21.5" pathLength="1" style="--dl:1.667s;--du:0.043s"/><path d="M639 570 L637 575 L637 587 L638 589 L637 608 L639 612" stroke-width="23" pathLength="1" style="--dl:1.718s;--du:0.014s"/><path d="M639 570 L648 567 L657 567 L664 569" stroke-width="23" pathLength="1" style="--dl:1.737s;--du:0.009s"/><path d="M638 590 L640 591 L653 591 L655 590 L656 591" stroke-width="23" pathLength="1" style="--dl:1.749s;--du:0.006s"/><path d="M640 613 L643 615 L648 616 L654 616 L661 614 L666 615" stroke-width="23" pathLength="1" style="--dl:1.759s;--du:0.009s"/><path d="M681 569 L684 591 L687 603 L690 609 L694 610 L697 608 L700 602 L701 595 L705 591 L707 587 L712 594 L715 605 L722 611 L726 606 L729 596 L729 589 L733 571 L732 568" stroke-width="22.9" pathLength="1" style="--dl:1.776s;--du:0.049s"/><path d="M771 569 L769 568 L763 569 L757 572 L753 578 L750 587 L750 598 L753 608 L758 613 L764 616 L776 615 L782 609 L786 596 L785 584 L780 573 L773 569 L767 569" stroke-width="19.6" pathLength="1" style="--dl:1.834s;--du:0.046s"/><path d="M808 570 L806 572 L805 577 L805 589 L807 595 L806 597 L806 615 L807 616" stroke-width="22" pathLength="1" style="--dl:1.888s;--du:0.016s"/><path d="M809 569 L814 566 L823 566 L829 569 L833 574 L834 582 L832 589 L828 593 L824 596 L812 596 L810 595 L806 596 L809 595 L824 596 L825 603 L827 607 L836 615" stroke-width="22" pathLength="1" style="--dl:1.908s;--du:0.038s"/><path d="M857 570 L856 576 L857 615 L856 617" stroke-width="22.2" pathLength="1" style="--dl:1.954s;--du:0.016s"/><path d="M887 569 L868 592 L859 592 L868 592 L871 595 L871 597 L874 601 L889 615" stroke-width="22.2" pathLength="1" style="--dl:1.974s;--du:0.026s"/></g></mask></defs><image href="logo-notagames.png" width="1200" height="624" preserveAspectRatio="none" mask="url(#mfw0)"/></svg><div class="shine"></div>
    </div>
    <div class="ipb" aria-hidden="true"><i></i></div>
    <div class="ist" id="ist" role="status"></div>
  </section>

  <!-- 1: updates available -->
  <section class="layer list" id="list" hidden>
    <div class="lbody">
      <div class="col-l">
        <h1 class="lh" id="list-title"></h1>
        <p class="ls" id="list-lead"></p>
        <div class="mods" id="mods"></div>
        <div class="total" id="total"></div>
      </div>
      <div class="col-r">
        <div class="nhead">
          <h2 class="nt"><span class="nl" data-t="whatsNew"></span><span id="notes-name"></span></h2>
          <label class="mute"><input type="checkbox" class="ck" id="skip"><span data-t="skipVersion"></span></label>
        </div>
        <p class="ncant" id="notes-cant" hidden><span data-t="cantNote"></span> <button type="button" class="llink" id="notes-open" data-t="openRelease"></button></p>
        <div class="notes" id="notes" tabindex="0" role="region" data-t-label="notesLabel"></div>
      </div>
    </div>
    <div class="lfoot">
      <p class="net" data-t="netList"></p>
      <button type="button" class="lb gho" id="list-play" data-t="playNoUpdate"></button>
      <button type="button" class="lb pri" id="list-update" data-t="updateAndPlay"></button>
    </div>
  </section>

  <!-- 2 / B: updating. The steps, label, percent, bar, log and the picture beside the logo all follow the
       launcher's events; when everything is in, the log makes way for the countdown card -->
  <section class="layer upd" id="upd" hidden>
    <div class="lbody">
      <div class="col-l">
        <h1 class="lh" id="upd-title"></h1>
        <p class="ls" id="upd-lead"></p>
        <ol class="steps" id="steps"></ol>
      </div>
      <div class="col-r">
        <div class="mstage wsc" aria-hidden="true">
          <i class="spk" style="left:14%;top:18%;--st:.15s"></i><i class="spk a" style="left:82%;top:12%;--st:.25s"></i><i class="spk" style="left:90%;top:62%;--st:.4s"></i><i class="spk a" style="left:10%;top:70%;--st:.35s"></i><i class="spk" style="left:50%;top:2%;--st:.5s"></i>
          <div class="mlogo" id="mlogo"><img src="logo-notagames.png" alt=""><div class="mgear"></div><div class="msp"></div><div class="mshine"></div></div>
          <div class="scbox" id="pictures">
            <svg class="sc wait" viewBox="0 0 84 72"><g class="gw fb"><rect class="ink" x="14" y="12" width="56" height="44" rx="4" style="fill:rgba(255,255,255,.04)"/><path class="ink" d="M14 22H70"/><path class="acc" d="M60 15L65 20M65 15L60 20" style="stroke-width:2.2"/><path d="M36 30V48L50 39Z" style="fill:var(--ink);opacity:.6"/></g></svg>
            <svg class="sc dl" viewBox="0 0 84 72"><path class="ink" d="M28 24H56A8 8 0 0 0 57 8.1A11 11 0 0 0 36 7.5A8.5 8.5 0 0 0 28 24Z"/><g class="ar"><path class="acc" d="M42 20V40M35 33L42 40L49 33"/></g><g class="tr"><path class="ink" d="M18 48V60A3 3 0 0 0 21 63H63A3 3 0 0 0 66 60V48"/><path class="ink" d="M18 53H32L35 57H49L52 53H66"/></g></svg>
            <svg class="sc chk" viewBox="0 0 84 72"><g class="doc"><path class="ink" d="M25 8H46L56 18V60A3 3 0 0 1 53 63H25A3 3 0 0 1 22 60V11A3 3 0 0 1 25 8Z" style="fill:rgba(255,255,255,.04)"/><path class="ink" d="M46 8V18H56"/><g style="fill:var(--ink);opacity:.75"><rect x="35" y="11" width="4" height="3"/><rect x="39" y="15" width="4" height="3"/><rect x="35" y="19" width="4" height="3"/><rect x="39" y="23" width="4" height="3"/><rect x="35" y="27" width="4" height="3"/></g><rect class="ink" x="35" y="32" width="8" height="9" rx="1.5" style="stroke-width:1.8"/></g><g class="lens"><circle class="acc" r="9" style="fill:rgba(82,199,184,.14)"/><path class="acc" d="M6.5 6.5L14 14" style="stroke-width:4"/><path d="M-5 -2.5A6 6 0 0 1 -1.5 -6" style="stroke:#fff;stroke-width:1.5;opacity:.7"/></g><g class="ok fb"><circle cx="56" cy="58" r="8" style="fill:var(--accent)"/><path d="M52.5 58L55 60.5L59.5 55.5" style="stroke:var(--on-accent);stroke-width:2.2"/></g></svg>
            <svg class="sc bak" viewBox="0 0 84 72"><path class="ink" d="M10 18H20L25 23V42A2 2 0 0 1 23 44H10A2 2 0 0 1 8 42V20A2 2 0 0 1 10 18Z"/><path class="acc fb cp" d="M10 18H20L25 23V42A2 2 0 0 1 23 44H10A2 2 0 0 1 8 42V20A2 2 0 0 1 10 18Z" style="stroke-width:2.2;fill:rgba(82,199,184,.18)"/><path class="ink" d="M47 37V58A2 2 0 0 0 49 60H73A2 2 0 0 0 75 58V37" style="fill:#1b252b"/><path class="ink" d="M56 44H66"/><rect class="ink lid" x="44" y="29" width="34" height="8" rx="2" style="fill:#1b252b;transform-box:fill-box;transform-origin:100% 100%"/></svg>
            <svg class="sc ins" viewBox="0 0 84 72"><path class="ink" d="M14 30H32L37 35H70V61A3 3 0 0 1 67 64H17A3 3 0 0 1 14 61Z" style="fill:rgba(255,255,255,.04)"/><path class="acc cd" d="M30 24H39L43 28V39H30Z" style="stroke-width:2;fill:#1d3a38"/><path class="acc cd c2" d="M45 24H54L58 28V39H45Z" style="stroke-width:2;fill:#1d3a38"/><path class="ink ff fb" d="M11 41H73L69 61A3 3 0 0 1 66 64H18A3 3 0 0 1 15 61Z" style="fill:#1b252b"/></svg>
          </div>
        </div>
        <div class="pcard">
          <div class="prow"><div class="pl" id="plabel"></div><div class="pp"><span class="pn" id="pct">0%</span></div></div>
          <div class="pbar" id="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="plabel"><div class="f" id="pfill"></div></div>
          <div class="psub" id="psub"></div>
        </div>
        <div class="tail">
          <div class="logbox" id="log" tabindex="0" data-t-label="logLabel"><div class="lns" id="log-lines"></div></div>
          <div class="again" id="upd-again">
            <div class="cd" role="timer">
              <svg viewBox="0 0 46 46" aria-hidden="true"><circle class="track" cx="23" cy="23" r="20"/><circle class="run" cx="23" cy="23" r="20"/></svg>
              <div class="nums" aria-hidden="true"><span class="n3">3</span><span class="n2">2</span><span class="n1">1</span></div>
              <span class="sr cd-text" aria-live="polite"></span>
            </div>
            <div class="at"><b data-t="cdTitle"></b><button type="button" class="llink not-now" data-t="notNow"></button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="lfoot">
      <p class="net" id="upd-net"></p>
      <button type="button" class="lb gho cx" id="upd-cancel" data-t="cancel"></button>
    </div>
  </section>

  <!-- 3: failed -->
  <section class="layer fail" id="fail" hidden>
    <div class="lbody one">
      <div class="errrow">
        <div class="ghmark" id="fail-gh" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg><span class="ghx">&#10005;</span></div>
        <div class="errmark" id="fail-mark" aria-hidden="true">!</div>
        <div class="errtext">
          <h1 class="lh" id="fail-title"></h1>
          <p class="ls" id="fail-lead"></p>
        </div>
      </div>
      <div><span class="okpill" id="fail-folder"><span class="mk"></span><span id="fail-folder-text"></span></span></div>
      <p class="already" id="fail-updated" hidden></p>
      <div class="again" id="fail-again" hidden>
        <div class="cd" role="timer">
          <svg viewBox="0 0 46 46" aria-hidden="true"><circle class="track" cx="23" cy="23" r="20"/><circle class="run" cx="23" cy="23" r="20"/></svg>
          <div class="nums" aria-hidden="true"><span class="n3">3</span><span class="n2">2</span><span class="n1">1</span></div>
          <span class="sr cd-text" aria-live="polite"></span>
        </div>
        <div class="at"><b data-t="cdTitleAgain"></b><button type="button" class="llink not-now" data-t="notNow"></button></div>
      </div>
      <details class="det" open>
        <summary data-t="details"></summary>
        <div class="logbox" id="fail-details" tabindex="0" data-t-label="details"></div>
      </details>
    </div>
    <div class="lfoot">
      <p class="net"><button type="button" class="llink" id="fail-openlog" data-t="openLog"></button> &nbsp;&middot;&nbsp; <button type="button" class="llink" id="fail-copy" data-t="copyDetails"></button></p>
      <button type="button" class="lb gho" id="fail-retry" data-t="tryAgain"></button>
      <button type="button" class="lb pri" id="fail-play" data-t="playNoUpdate"></button>
    </div>
  </section>

</div>
<script src="strings.js"></script>
<script src="notes.js"></script>
<script src="launcher.js"></script>
</body>
</html>
